version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tiretests
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tiretests
      DB_USER: appuser
      DB_PASSWORD: app_password
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8080/api
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db_data:
